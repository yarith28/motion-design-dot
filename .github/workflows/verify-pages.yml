name: Verify live arcade
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pages.yml'
      - 'mini-games/**'
      - 'index.html'
      - '.nojekyll'
permissions:
  contents: read
concurrency:
  group: verify-live-arcade
  cancel-in-progress: true
jobs:
  live-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the original collection and showcase
        run: node mini-games/tests/preservation.cjs
      - name: Install test-only browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-smoke" playwright@1.55.0
          "$RUNNER_TEMP/pages-smoke/node_modules/.bin/playwright" install chromium
      - name: Verify deployed assets and desktop/mobile route-reset smoke
        id: live-smoke
        env:
          NODE_PATH: ${{ runner.temp }}/pages-smoke/node_modules
          LIVE_BASE_URL: https://yarith28.github.io/motion-design-dot
        run: node mini-games/tests/live-pages.cjs
      - name: Verify reviewed fixes on deployed Chromium UI
        env:
          NODE_PATH: ${{ runner.temp }}/pages-smoke/node_modules
          BASE_URL: https://yarith28.github.io/motion-design-dot
        run: |
          set -o pipefail
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          for suite in resume-focus number-room-review-regressions spatial-accessibility review-arcade-strategy expansion-controls systems-remediation tabletop-remediation puzzle-remediation kinetic-remediation discovery-remediation; do
            node "mini-games/tests/$suite.cjs" | tee "live-verification/fix-$suite-chromium.log"
          done
      - name: Install WebKit for browser-engine regression checks
        if: ${{ !cancelled() && steps.live-smoke.outcome == 'success' }}
        run: '"$RUNNER_TEMP/pages-smoke/node_modules/.bin/playwright" install --with-deps webkit'
      - name: Verify reviewed fixes on deployed WebKit UI
        if: ${{ !cancelled() && steps.live-smoke.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/pages-smoke/node_modules
          BASE_URL: https://yarith28.github.io/motion-design-dot
          BROWSER_ENGINE: webkit
        run: |
          set -o pipefail
          for suite in resume-focus number-room-review-regressions spatial-accessibility review-arcade-strategy expansion-controls systems-remediation tabletop-remediation puzzle-remediation kinetic-remediation discovery-remediation; do
            node "mini-games/tests/$suite.cjs" | tee "live-verification/fix-$suite-webkit.log"
          done
      - name: Save live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-arcade-verification
          path: |
            live-verification/
            mini-games/coverage/*-remediation-*.json
          retention-days: 30
  new-game-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        room: [systems-room, tabletop-room, puzzle-lab, kinetic-room, discovery-room]
    steps:
      - uses: actions/checkout@v4
      - name: Install test-only browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/completion" playwright@1.55.0
          "$RUNNER_TEMP/completion/node_modules/.bin/playwright" install chromium
      - name: Complete every new game through desktop and touch UI
        env:
          NODE_PATH: ${{ runner.temp }}/completion/node_modules
          BASE_URL: http://127.0.0.1:8790
          ROOM: ${{ matrix.room }}
        run: |
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          python3 -m http.server 8790 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          if [ "$ROOM" = "puzzle-lab" ]; then node mini-games/tests/puzzle-generation-regression.cjs; fi
          if [ "$ROOM" = "discovery-room" ]; then node mini-games/tests/discovery-design-properties.cjs; fi
          node mini-games/tools/run-suite.cjs "$ROOM"
          node mini-games/tests/evidence-index.cjs
          node mini-games/tests/evidence-fresh.cjs
          node mini-games/tools/coverage-index.cjs
      - name: Save exact-commit completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completion-${{ matrix.room }}
          path: |
            mini-games/coverage/${{ matrix.room }}.json
            mini-games/coverage/suite-runs/${{ matrix.room }}.json
            mini-games/coverage/puzzle-generation-regression.json
            mini-games/coverage/discovery-design-properties.json
          retention-days: 30
